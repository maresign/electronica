var lang = (navigator.language||'').toLowerCase().indexOf('tr')===0 ? 'tr' : 'en';
try { var q = new URLSearchParams(location.search).get('lang'); if (q==='tr'||q==='en') lang=q; } catch(e){}
var cur = 0, playing = false, muted = false, timer = null, token = 0;
var $ = function(id){return document.getElementById(id);};
var synth = window.speechSynthesis || null;

function voiceFor(l){
  if(!synth) return null;
  var vs = synth.getVoices(), want = l==='tr' ? 'tr' : 'en';
  var list = vs.filter(function(v){return v.lang && v.lang.toLowerCase().indexOf(want)===0;});
  if(!list.length) return null;
  var pref = list.filter(function(v){return /natural|neural|online|google|premium|enhanced/i.test(v.name);});
  if(want==='en'){ var gb = (pref.length?pref:list).filter(function(v){return /en-gb/i.test(v.lang);}); if(gb.length) return gb[0]; }
  return (pref[0]||list[0]);
}
function render(){
  $('scenes').innerHTML = S.map(function(s,i){return '<section class="scene'+(i===cur?' on':'')+'" aria-hidden="'+(i!==cur)+'">'+s.v(s[lang])+'</section>';}).join('');
  $('dots').innerHTML = S.map(function(_,i){return '<i class="'+(i===cur?'on':'')+'" data-i="'+i+'" title="'+(i+1)+'"></i>';}).join('');
  $('bar').style.width = ((cur+1)/S.length*100)+'%';
  $('cap').textContent = S[cur][lang].say;
  document.documentElement.lang = lang;
  Array.prototype.forEach.call(document.querySelectorAll('.lang'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang);});
  $('play').textContent = playing ? '❚❚' : '▶';
  $('mute').textContent = muted ? '🔇' : '🔊';
  $('back').title = lang==='tr' ? 'Platforma dön' : 'Back to the platform';
}
function stopAll(){ token++; clearTimeout(timer); if(synth) synth.cancel(); }
function speakScene(){
  stopAll(); var my = token; var text = S[cur][lang].say;
  var advance = function(){ if(my!==token||!playing) return; timer = setTimeout(function(){ if(my!==token) return; if(cur<S.length-1){cur++;render();speakScene();} else {playing=false;render();} }, 900); };
  var v = muted ? null : voiceFor(lang);
  if(!v || !synth){ timer = setTimeout(advance, Math.max(5000, text.length*62)); return; }
  var parts = text.match(/[^.!?]+[.!?]*/g) || [text], i = 0;
  var next = function(){
    if(my!==token) return;
    if(i>=parts.length){ advance(); return; }
    var u = new SpeechSynthesisUtterance(parts[i++].trim()); u.voice = v; u.lang = v.lang; u.rate = lang==='tr' ? 0.98 : 1.0; u.pitch = 1;
    u.onend = next; u.onerror = next; synth.speak(u);
  };
  next();
}
function go(i){ cur = Math.max(0,Math.min(S.length-1,i)); render(); if(playing) speakScene(); else stopAll(); }
$('go').onclick = function(){ $('start').style.display='none'; playing = true; render(); speakScene(); };
$('play').onclick = function(){ playing = !playing; render(); if(playing) speakScene(); else stopAll(); };
$('prev').onclick = function(){ go(cur-1); };
$('next').onclick = function(){ go(cur+1); };
$('mute').onclick = function(){ muted = !muted; render(); if(playing) speakScene(); };
$('dots').onclick = function(e){ var i = e.target.getAttribute('data-i'); if(i!==null) go(+i); };
Array.prototype.forEach.call(document.querySelectorAll('.lang'),function(b){ b.onclick = function(){ lang = b.getAttribute('data-l'); render(); if(playing) speakScene(); }; });
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') go(cur+1); else if(e.key==='ArrowLeft') go(cur-1); else if(e.key===' '){ e.preventDefault(); $('play').click(); } });
document.addEventListener('visibilitychange',function(){ if(document.hidden && playing){ playing=false; stopAll(); render(); } });
if(synth && synth.onvoiceschanged!==undefined) synth.onvoiceschanged = function(){};
render();
})();
</script>
